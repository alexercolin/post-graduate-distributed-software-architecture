[project]
name = "catalog-service"
version = "0.1.0"
description = "Catalog microservice — bounded context with CQRS write/read split."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "redis>=5.0",
  "httpx>=0.27",
]

[tool.uvicorn]
app = "app.main:app"
