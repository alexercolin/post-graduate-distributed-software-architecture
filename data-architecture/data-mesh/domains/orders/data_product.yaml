domain: orders
owner: orders-team@example.com
version: 1.0.0
description: Source-of-truth for customer orders.

products:
  - name: orders_raw
    type: source-aligned
    schema: contracts/orders.schema.json
    slo:
      freshness: 1h
      completeness: ">= 99.5%"
    depends_on: []
    output_ports:
      - kind: iceberg-table
        address: iceberg.orders.orders_raw
      - kind: sql
        address: "trino://localhost:8080 -> iceberg.orders.orders_raw"

  - name: orders_daily
    type: aggregate
    slo:
      freshness: 24h
    depends_on:
      - orders.orders_raw
    output_ports:
      - kind: iceberg-table
        address: iceberg.orders.orders_daily
